<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/ima/icon.svg" type="image/svg">
    <title>Smart School Vision</title>
    <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/static/obn.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@^2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="/static/main.js"></script>
    <script type="module" src="/static/obn.js"></script>
    <script type="module" src="/static/rasp.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Nunito" />
    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
    <link href="/static/site.css" rel="stylesheet" type="text/css" />

</head>

<body>
    <div class="connection-status" id="connectionStatus">Подключение...</div>

    <div class="container">
        <div class="menu">

            <div class="logo">
                <img src="/static/ima/Logo and company.svg" alt="Company Logo">
            </div>

            <div class="menu-items">
                <a href="#" class="menu-item active">
                    <img src="/static/ima/Dashboard.svg" alt="Dashboard">
                </a>
                <a href="/grafik" class="menu-item">
                    <img src="/static/ima/Analytics.svg" alt="Analytics">
                </a>
                <a href="/spisk" class="menu-item">
                    <img src="/static/ima/Schedule.svg" alt="Schedule">
                </a>
                <a href="/camera" class="menu-item">
                    <img src="/static/ima/Camera.svg" alt="Schedule">
                </a>
            </div>

            <a href="#" class="menu-item">
                <img src="/static/ima/Illustration.jpg" alt="Illustration">
            </a>
            <div class="profile-section">
                <img src="static/ima/ic3.svg" alt="Profile" class="profile-picture">
                <div class="info">
                    <strong id="user-name">Загрузка...</strong>
                    <span id="user-role">...</span>
                </div>
                <div class="logout-icon" onclick="logout()">
                    <img src="/static/ima/logout.svg" alt="Logout">
                </div>
            </div>
        </div>

        <div class="osn">
            <div class="name">
                Панель управления
            </div>
            <div class="inf">
                <div class="ruk">
                    <img src="/static/ima/ruk.svg" alt="ruk" class="ruk__img">
                    <div class="ruk__text">
                        <span class="ruk__count" id="total-count">0</span>
                        <span class="ruk__label">Учеников распознано</span>
                    </div>
                </div>
                <div class="ruk">
                    <img src="/static/ima/jak.svg" alt="ruk" class="ruk__img">
                    <div class="ruk__text">
                        <span class="ruk__count" id="flick-count">0</span>
                        <span class="ruk__label">Фликеров найдено</span>
                    </div>
                </div>
                <div class="ruk">
                    <img src="/static/ima/depr.svg" alt="ruk" class="ruk__img">
                    <div class="ruk__text">
                        <span class="ruk__count" id="depr-count">0</span>
                        <span class="ruk__label">Депрессии</span>
                    </div>
                </div>
                <div class="ruk">
                    <img src="/static/ima/opoz.svg" alt="ruk" class="ruk__img">
                    <div class="ruk__text">
                        <span class="ruk__count" id="late-count">0</span>
                        <span class="ruk__label">Опозданий</span>
                    </div>
                </div>
            </div>

            <div class="analytics">
                <div class="chart-container" id="lineContainer">
                    <h3>График посещаемости</h3>
                    <div id="attendanceChart"></div>
                </div>
                <div class="chart-container" id="pieContainer">
                    <h3>Статистика дня</h3>
                    <div id="pieChart"></div>
                </div>
            </div>

            <div class="live-feed">
                <div class="liveobn" id="live-obn">
                    <h3>Последние обнаружения</h3>
                    <div id="live-detections"></div>
                </div>
                <div class="liveobn2" id="cameranew">
                    <h3>Расписание уроков</h3>
                    <div class="schedule-container">
                        <div class="schedule-header">
                            <div class="class-selector">
                                <label for="class-select">Класс:</label>
                                <select id="class-select">
                    <option value="" disabled selected>Загрузка...</option>
                </select>
                            </div>
                            <div class="date-display" id="date-display">

                            </div>
                        </div>

                        <div class="schedule-list" id="scheduleList">
                            <div class="loading-message">
                                <div class="loading-spinner"></div>
                                <div>Загрузка расписания...</div>
                            </div>
                        </div>

                        <div class="current-lesson" id="currentLesson">
                            <div class="current-label">Сейчас:</div>
                            <div class="current-info">
                                <div class="current-subject">-</div>
                                <div class="current-time">-</div>
                            </div>
                            <div class="current-classroom">-</div>
                        </div>

                        <div class="no-lessons" id="noLessons">
                            <div class="no-lessons-icon">🏫</div>
                            <div class="no-lessons-text">Уроки закончены</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            function logout() {
                localStorage.clear();
                sessionStorage.clear();
                localStorage.clear();
                window.location.href = "/login";
                console.log('112');
            }
        </script>
</body>

</html>

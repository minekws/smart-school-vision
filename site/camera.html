<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="ima/icon.svg" type="image/svg">
    <title>Smart School Vision</title>
    <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="static/camera.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@^2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Nunito" />
    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
    <link href="static/site.css" rel="stylesheet" type="text/css" />
    <style>
        .camera-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="menu">

            <div class="logo">
                <img src="static/ima/Logo and company.svg" alt="Company Logo">
            </div>

            <div class="menu-items">
                <a href="/" class="menu-item">
                    <img src="/static/ima/Dashboard2.svg" alt="Dashboard">
                </a>
                <a href="/grafik" class="menu-item">
                    <img src="/static/ima/Analytics.svg" alt="Analytics">
                </a>
                <a href="/spisk" class="menu-item">
                    <img src="/static/ima/Schedule.svg" alt="Schedule">
                </a>
                <a href="#" class="menu-item active">
                    <img src="/static/ima/camera2.svg" alt="Schedule">
                </a>
            </div>

            <a href="#" class="menu-item">
                <img src="static/ima/Illustration.jpg" alt="Illustration">
            </a>
            <div class="profile-section">
                <img src="static/ima/ic3.svg" alt="Profile" class="profile-picture">
                <div class="info">
                    <strong id="user-name">Загрузка...</strong>
                    <span id="user-role">...</span>
                </div>
                <div class="logout-icon" onclick="logout()">
                    <img src="static/ima/logout.svg" alt="Logout">
                </div>
            </div>
        </div>

        <div class="osn">
            <div class="name">
                Камеры
            </div>
            <div class="camera-container">
                <img src="http://127.0.0.1:5000/01/camera/0/video_feed" alt="Camera 0">
                <img src="http://127.0.0.1:5000/01/camera/1/video_feed" alt="Camera 1">
                <img src="http://127.0.0.1:5000/01/camera/2/video_feed" alt="Camera 2">
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const name = document.getElementById('user-name');
            const role = document.getElementById('user-role');

            name.innerHTML = localStorage.getItem('username') || 'Гость';
            role.innerHTML = localStorage.getItem('userRole') || 'Пользователь';
        });
    </script>
</body>

</html>
